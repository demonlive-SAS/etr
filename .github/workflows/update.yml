name: Update RTE playlist & EPG

on:
  schedule:
    - cron: "0 */8 * * *"   # every 4 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scrape_rte.py --debug

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rte.m3u rte.xml.gz
          git diff --cached --quiet || git commit -m "Update RTE playlist/EPG $(date -u +'%Y-%m-%d %H:%M')"
          git push
